# RAISE Lab students. This one list drives two things:
#   - the student cards and Alumni section on the Advisees page
#   - the dagger (†) after lab students' names on the Research page
#
# name:      must match the spelling in _data/publications.yml `authors`
# role:      phd | ms | undergrad
# linkedin:  optional profile URL
# note:      optional short line under the name
# graduated: true moves the student to the Alumni section
# graduation: optional, shown on the alumni card, e.g. "May 2025" or "2025".
#             M.S./Ph.D. cards read "M.S., thesis defended in May 2025";
#             B.S. cards read "B.S., graduated in May 2025".
#             Without it, the card reads "M.S., RAISE Lab".
# milestone:  optional, replaces "thesis defended"/"graduated" for one student,
#             e.g. milestone: "graduated" for an M.S. student without a thesis
#
# Advisory-committee students are listed in _data/committee_students.yml
# because they belong to other labs.

