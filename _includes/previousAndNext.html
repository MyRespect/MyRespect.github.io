<div class="post-recent">
    <div class="pre">
        {% if page.previous %}
        <p><strong>PREV</strong> <a href="{{ page.previous.url | relative_url }}">{{ page.previous.title }}</a></p>
        {% endif %}
    </div>
    <div class="nex">

        {% if page.next %}
        <p><strong>NEXT</strong> <a href="{{ page.next.url | relative_url }}">{{ page.next.title }}</a></p>
        {% endif %}
    </div>
</div>
